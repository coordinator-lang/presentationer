:root{
  color-scheme:light;
  --navy:#262262; --navy-deep:#1a1747; --ink:#1c1b33; --text:#3d3c57; --muted:#6f6e88; --line:#e6e5ef; --soft:#f6f6fa;
  --tint:#eeedf7; --radius:14px; --shadow:0 1px 2px rgba(28,27,51,.06), 0 8px 24px rgba(28,27,51,.06);
  --font:'THICCCBOI', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font:400 16px/1.55 var(--font);}
img{display:block;max-width:100%}
a{color:var(--navy)}
h1,h2,h3{font-family:var(--font);font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #7c78d8;outline-offset:2px;border-radius:6px}

/* top band */
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.top .logo{height:34px;width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;
  font:500 15px/1 var(--font);text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-deep)}
.btn-line{background:#fff;color:var(--navy);border-color:#cfcde6}
.btn-line:hover{border-color:var(--navy)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.banner{background:#fff6d6;color:#5b4700;font-size:14px;padding:8px 20px;text-align:center}

/* hero */
.hero{padding:28px 0 8px}
.cover{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--soft);aspect-ratio:16/9;max-height:70vh;width:100%;
  border:0;padding:0;cursor:zoom-in;display:block}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .count{position:absolute;right:14px;bottom:14px;background:rgba(20,18,50,.72);color:#fff;font:500 14px/1 var(--font);
  padding:9px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(4px)}
.cover .count svg{width:16px;height:16px}
.headline{padding:22px 0 0}
.eyebrow{font:500 13px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.headline h1{font-size:clamp(28px,4.2vw,42px);line-height:1.12}
.nw{white-space:nowrap}
.sub{margin:10px 0 0;font-size:17px;color:var(--text)}
.avail{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#e9f6ee;color:#17603a;font:500 14px/1 var(--font);padding:8px 12px;border-radius:999px}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:#22a05a}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 48px;padding-bottom:24px}
@media (min-width:960px){ .layout{grid-template-columns:minmax(0,1fr) 340px} .aside{grid-column:2;grid-row:1} }
sup{font-size:.62em;line-height:0;vertical-align:.6em}
section.block{padding:28px 0;border-top:1px solid var(--line)}
section.block:first-child{border-top:0}
section.block h2{font-size:22px;margin-bottom:16px}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.fact{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:14px}
.ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.fact .k{font-size:13px;color:var(--muted);line-height:1.2}
.fact .v{font-weight:700;color:var(--ink);font-size:17px;line-height:1.25}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:7px;background:var(--tint);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px}
.chips li svg{width:15px;height:15px;color:var(--navy);flex:none}
.sub2{font:700 16px/1.3 var(--font);color:var(--ink);margin:22px 0 12px}
.other{white-space:pre-line;margin:0}

/* photos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} }
.thumb{border:0;padding:0;background:var(--soft);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.thumb:hover img{transform:scale(1.03)}

/* map */
.map{height:340px;border-radius:var(--radius);overflow:hidden;background:var(--soft);border:1px solid var(--line);z-index:0}
.mapnote{font-size:14px;color:var(--muted);margin:10px 0 0}
.loc-line{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-weight:500;color:var(--ink)}
.maplink{margin:14px 0 0}
.loc-line svg{width:20px;height:20px;color:var(--navy)}

/* contact card */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.aside .card{position:sticky;top:24px;margin-top:28px}
.card h2{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 16px;color:var(--text)}
.card .ref{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 16px;font-size:15px}
.card .ref b{color:var(--ink)}
.card .btns{display:grid;gap:10px}
.card .btns .btn{width:100%}

/* services */
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;margin:0;padding:0;list-style:none}
@media (min-width:700px){ .services{grid-template-columns:repeat(4,minmax(0,1fr))} }
.services li{display:flex;flex-direction:column;gap:8px}
.services h3{font-size:16px;line-height:1.25}
.services p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}

/* footer */
.foot{background:var(--navy);color:#d9d8ee;margin-top:24px}
.foot .wrap{padding-top:32px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.foot .logo{height:30px;width:auto;margin-bottom:16px}
.foot p{margin:0 0 6px;font-size:14px}
.foot a{color:#fff;text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .privacy{margin-top:14px;font-size:13px;color:#b7b5d6}

/* states */
.state{max-width:560px;margin:12vh auto;padding:0 20px;text-align:center}
.state h1{font-size:28px;margin-bottom:10px}
.state p{color:var(--muted);margin:0 0 22px}
.state .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.skel{background:linear-gradient(90deg,var(--soft) 0%,#ececf4 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:var(--radius)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .skel{animation:none} .thumb img{transition:none} }

/* lightbox */
dialog.lb{border:0;padding:0;margin:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;background:rgba(12,11,30,.96);color:#fff}
dialog.lb::backdrop{background:rgba(12,11,30,.96)}
.lb .stage{position:absolute;inset:56px 0 64px;display:grid;place-items:center;touch-action:pan-y}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb .bar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;font:500 15px/1 var(--font)}
.lb button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb button svg{width:22px;height:22px}
.lb .nav{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:14px}
@media (min-width:800px){ .lb .nav{position:static} .lb .prev,.lb .next{position:absolute;top:50%;transform:translateY(-50%)} .lb .prev{left:16px} .lb .next{right:16px} .lb .stage{inset:56px 80px 24px} }

.print-only{display:none}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .top .logo{height:28px}
  .top .btn-ghost span{display:none}
  .top .btn-ghost{padding:0 12px}
  .hero{padding-top:16px}
  .cover{aspect-ratio:4/3}
  .map{height:280px}
}

/* print → A4 PDF */
@page{size:A4;margin:12mm 12mm 14mm}
@media print{
  body{font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;padding:0}
  .top .btn,.banner,.aside,.grid,dialog,.cover .count,.noprint{display:none!important}
  .top .wrap{min-height:0;padding:7mm 0;justify-content:center}
  .top{border-radius:3mm}
  .hero{padding-top:6mm}
  .cover{aspect-ratio:auto;height:85mm;max-height:none;border-radius:3mm}
  .layout{display:block}
  section.block{padding:5mm 0;break-inside:avoid}
  section.block h2{font-size:14pt;margin-bottom:3mm}
  .facts{grid-template-columns:repeat(4,1fr);gap:2.5mm}
  .fact{padding:2.5mm}
  .map{height:70mm}
  .print-only{display:block}
  .pphotos .pp{height:122mm;margin:0 0 5mm;break-inside:avoid;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:3mm;overflow:hidden}
  .pphotos .pp:nth-child(2n+1){break-before:page}
  .pphotos .pp img{max-width:100%;max-height:100%;object-fit:contain}
  .services{grid-template-columns:repeat(4,1fr);gap:4mm}

(() => {
// Nordicta presentationer – shared rules. One source file, used by:

const BOARD_ID = 1453497707;
const VIEW_URL = 'https://coordinator-lang.github.io/presentationer/';   // later presentationer.nordicta.com
const PHOTO_BUCKET = 'presentation-photos';
// koord 2026-10-02: the map uses "(E) Google maps" (on purpose not the exact address; "(Intern) Plats" is never read).
// The customer sees a circle of about 600 m centred on it, and a link to the same Google maps place.
const MAP_RADIUS_M = 600;
const CONTACT = { email:'info@nordicta.com', phone:'+46 8 721 71 11', tel:'+4687217111', web:'https://www.nordicta.com', webLabel:'nordicta.com' };

// The ONLY Monday columns the server asks for. The landlord's name, company and contact details, the rent and costs
// (Nordicta's purchase price), the (Intern) fields, notes, class and quality are never requested, so they cannot leak.
// taggar__1 "(Intern) Stad" is read only to suggest the town name; the editor shows it for a person to confirm.
const SAFE_COLUMNS = ['text_mm4sw4jf', 'filer', 'status3', 'rullgardin_12', 'rullgardin_10', 'paragraf', 'l_nk42',
  'siffror', 'siffror6', 'siffror0', 'duschar', 'wc', 'color_mkpsz7cj', 'date_mm6ng4aq', 'taggar__1'];

const MIME = { jpg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif' };

/** "n125-2381 " → "N125-2381"; anything else → "". */
function normalizeObjektNr(s){
  const v = String(s == null ? '' : s).trim().toUpperCase().replace(/\s+/g, '').replace(/[–—]/g, '-');
  return /^[A-Z]\d{2,4}-\d{2,6}$/.test(v) ? v : '';
}

/** ".JPEG" → "jpg"; not a browser image → "". */
function imageExt(e){
  const v = String(e || '').toLowerCase().replace(/^\./, '');
  return v === 'jpeg' || v === 'jpg' ? 'jpg' : MIME[v] ? v : '';
}

function photoPath(itemId, assetId, ext){ return 'obj/' + itemId + '/' + assetId + '.' + ext; }

function num(t){
  const s = String(t == null ? '' : t).trim().replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) && n >= 0 && n < 100000 ? n : null;
}
function str(v, max){ return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max); }
function longText(v, max){
  return String(v == null ? '' : v).replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, max);
}
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Monday's dropdown labels are hand-made and uneven (case, typos, two labels glued together). Fix the known ones.
const LIST_FIX = {
  'wi-fi':'Wi-Fi', 'wifi':'Wi-Fi', 'tv':'TV', 'wc':'WC', 'washingmachine':'Washing machine', 'coffe machine':'Coffee machine',
  'dusch in other unit':'Shower in other unit', 'wc in other unit':'WC in other unit', 'kitchenette (mini kitchen)':'Kitchenette',
  'no utilities includedparking (included)':['No utilities included', 'Parking (included)'],
};
/** "wi-fi, TV, tv, Kitchen" → ["Wi-Fi", "TV", "Kitchen"] */
function cleanList(text){
  const out = [], seen = new Set();
  for (const raw of String(text || '').split(',')) {
    const t = raw.replace(/\s+/g, ' ').trim();
    if (!t) continue;
    const fixed = LIST_FIX[t.toLowerCase()];
    for (const v of [].concat(fixed || cap(t))) {
      const k = v.toLowerCase();
      if (!seen.has(k)) { seen.add(k); out.push(v.slice(0, 60)); }
    }
  }
  return out.slice(0, 40);
}

const FURNISHED = { 'möblerad':'Furnished', 'fully furnished':'Furnished', 'furnished':'Furnished', 'delvis möblerad':'Partially furnished',
  'partially furnished':'Partially furnished', 'omöblerad':'Unfurnished', 'unfurnished':'Unfurnished', 'ospecificerad':'' };
function furnishedEn(t){
  const k = str(t, 60).toLowerCase();

const TYPE_FIX = { 'unspecified':'', 'shared accommdoation':'Shared accommodation', 'town house':'Town house', 'town house ; cottage ; cottage':'Cottage' };
function propertyType(t){
  const v = str(t, 60), k = v.toLowerCase();
  return k in TYPE_FIX ? TYPE_FIX[k] : v;
}

// "(Intern) Stad" (koord 2026-10-02): on newer objects the first tag is the country and the second the town the
// address is in. Older objects have no country tag and start with the town. So: the first tag that is not a country.
const COUNTRIES = new Set(['sverige', 'sweden', 'finland', 'suomi', 'norge', 'norway', 'danmark', 'denmark', 'island', 'iceland',
  'tyskland', 'germany', 'deutschland', 'nederländerna', 'nederland', 'netherlands', 'holland', 'belgien', 'belgium', 'frankrike', 'france',
  'italien', 'italy', 'spanien', 'spain', 'portugal', 'österrike', 'austria', 'schweiz', 'switzerland', 'irland', 'ireland',
  'storbritannien', 'england', 'uk', 'polen', 'poland', 'estland', 'estonia', 'lettland', 'latvia', 'litauen', 'lithuania',
  'slovenien', 'slovenia', 'tjeckien', 'czechia', 'luxemburg', 'luxembourg']);
/** "Sverige, Gävle, Sandviken" → ["Gävle", "Sandviken"]; the first one is the town. */
function townsFromTags(text){
  return String(text || '').split(',').map(s => s.trim()).filter(t => t && !COUNTRIES.has(t.toLowerCase()));
}

// koord 2026-10-02: the heading is always "Property offer · <objektnr>" (type and town are on the line below it).
function defaultTitle(ref){

}

/** Asset ids in the Bilder column, in the column's order. item.assets also has every other file on the item
 *  (e.g. the DocuGen PDF in the Presentation column), so the column decides what counts as a photo. */
function photoAssetIds(item){
  const cv = (item.column_values || []).find(c => c.id === 'filer');
  let v = null; try { v = cv && cv.value ? JSON.parse(cv.value) : null; } catch (e) {}
  return ((v && v.files) || []).map(f => String(f.assetId)).filter(id => /^\d+$/.test(id));
}

/** A Monday item (only SAFE_COLUMNS + assets) → what the editor starts from. Warnings are Swedish, for the team. */
function draftFromMondayItem(item){
  const cv = {};
  for (const c of item.column_values || []) cv[c.id] = c;
  const text = id => (cv[id] && cv[id].text) || '';
  const warnings = [];

  const assets = new Map((item.assets || []).map(a => [String(a.id), a]));
  const photos = []; let skipped = 0;
  for (const id of photoAssetIds(item)) {
    const a = assets.get(id), ext = a && imageExt(a.file_extension);
    if (!ext) { skipped++; continue; }
    photos.push({ asset_id:id, name:str(a.name, 120), ext, size:a.file_size || 0, preview_url:a.public_url || '' });
  }

  let mapUrl = '';
  try { const v = cv.l_nk42 && cv.l_nk42.value ? JSON.parse(cv.l_nk42.value) : null; mapUrl = (v && v.url) || ''; } catch (e) {}
  if (!mapUrl) { const m = text('l_nk42').match(/https?:\/\/\S+/); mapUrl = m ? m[0] : ''; }

  const towns = townsFromTags(text('taggar__1'));
  const type = propertyType(text('status3'));
  const date = text('date_mm6ng4aq').slice(0, 10);
  const draft = {
    ref:normalizeObjektNr(text('text_mm4sw4jf')),
    monday_item_id:Number(item.id) || null,
    type,
    size_m2:num(text('siffror')),
    bedrooms:num(text('siffror6')),
    beds:num(text('siffror0')),
    showers:num(text('duschar')),
    wc:num(text('wc')),
    furnished:furnishedEn(text('color_mkpsz7cj')),
    available_from:/^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '',
    location:towns[0] || '',
    map_url:mapUrl,
    map:null,
    amenities:cleanList(text('rullgardin_12')),
    utilities:cleanList(text('rullgardin_10')),
    other_info:longText(text('paragraf'), 3000),
    photos:photos.map(p => ({ asset_id:p.asset_id })),
  };

  if (!type) warnings.push('Property type saknas i Monday (eller är "Unspecified"), så fältet visas inte.');
  if (!draft.amenities.length) warnings.push('Amenities saknas i Monday.');
  if (!draft.utilities.length) warnings.push('Utilities saknas i Monday.');
  if (!photos.length) warnings.push('Inga bilder i kolumnen Bilder.');
  if (skipped) warnings.push(skipped + (skipped === 1 ? ' fil' : ' filer') + ' i Bilder är inte bilder som webbläsare kan visa (t.ex. PDF eller HEIC) och hoppas över.');
  if (!mapUrl) warnings.push('Google maps-länk saknas i Monday, så ingen karta visas. Klistra in en länk under Plats om du vill ha en.');
  if (!draft.location) warnings.push('Ort saknas. Fyll i den under Plats.');
  return { draft, photos, towns, warnings };
}

/* ---------- Google maps link → centre of the circle ---------- */
const COORD = '(-?\\d{1,3}(?:\\.\\d+)?)';
const MAP_PATTERNS = [
  new RegExp('!3d' + COORD + '!4d' + COORD),                                              // the pin of a place
  new RegExp('/(?:search|place|dir)/' + COORD + ',[+\\s]*' + COORD),                       // /maps/search/52.66,+4.97
  new RegExp('[?&](?:q|query|ll|center|destination|daddr)=(?:loc:)?' + COORD + ',[+\\s]*' + COORD, 'i'),
  new RegExp('@' + COORD + ',' + COORD),                                                   // the view (or Street View camera)
];
/** Coordinates written in a Google maps URL, or null. Short links (maps.app.goo.gl) must be followed first. */
function parseMapUrl(url){
  let u = String(url || '');
  for (let i = 0; i < 2; i++) { try { const d = decodeURIComponent(u); if (d === u) break; u = d; } catch (e) { break; } }
  for (const re of MAP_PATTERNS) {
    const m = u.match(re);
    if (!m) continue;
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (validLatLng(lat, lng)) return { lat:round6(lat), lng:round6(lng) };
  }
  return null;
}
function validLatLng(lat, lng){
  return typeof lat === 'number' && typeof lng === 'number' && isFinite(lat) && isFinite(lng)
    && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0);
}
function round6(n){ return Math.round(n * 1e6) / 1e6; }
/** The Google maps link the customer may open: https, on a Google map host, at most 500 characters; else "". */
function cleanMapUrl(url){
  const u = String(url == null ? '' : url).trim();
  return u.length <= 500 && /^https:\/\//i.test(u) && isGoogleMapsUrl(u) && u.indexOf('consent.google.') < 0 ? u : '';
}
/** The server follows redirects only on Google's own map hosts. */
function isGoogleMapsUrl(url){
  let h = '';
  try { const u = new URL(url); if (u.protocol !== 'https:' && u.protocol !== 'http:') return false; h = u.hostname.toLowerCase(); } catch (e) { return false; }
  return h === 'maps.app.goo.gl' || h === 'goo.gl' || /^(www\.|maps\.)?google\.[a-z.]{2,6}$/.test(h) || h === 'consent.google.com';
}

/* ---------- saving ---------- */
/** What the editor sends → a clean draft. Anything not listed here is dropped. */
function sanitizeDraft(d){
  d = d && typeof d === 'object' ? d : {};
  const list = v => (Array.isArray(v) ? v.join(',') : String(v || ''));
  const n = v => (v === '' || v == null ? null : num(v));
  const date = String(d.available_from || '').slice(0, 10);
  let map = null;
  if (d.map && typeof d.map === 'object') {
    const lat = Number(d.map.lat), lng = Number(d.map.lng);
    if (validLatLng(lat, lng)) map = { lat:round6(lat), lng:round6(lng) };
  }
  const mapUrl = cleanMapUrl(d.map_url);
  const photos = [], seen = new Set();
  for (const p of Array.isArray(d.photos) ? d.photos : []) {
    const id = String(p && p.asset_id || '');
    if (/^\d{1,15}$/.test(id) && !seen.has(id)) { seen.add(id); photos.push({ asset_id:id }); }
  }
  return {
    ref:normalizeObjektNr(d.ref),
    monday_item_id:/^\d{1,15}$/.test(String(d.monday_item_id || '')) ? Number(d.monday_item_id) : null,
    type:str(d.type, 60),
    size_m2:n(d.size_m2), bedrooms:n(d.bedrooms), beds:n(d.beds), showers:n(d.showers), wc:n(d.wc),
    furnished:str(d.furnished, 40),
    available_from:/^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '',
    location:str(d.location, 80),
    map,
    map_url:mapUrl,
    amenities:cleanList(list(d.amenities)),
    utilities:cleanList(list(d.utilities)),
    other_info:longText(d.other_info, 3000),
    photos:photos.slice(0, 40),
  };
}

/** The stored snapshot: what the customer sees, frozen when the link is created or saved. */
function buildSnapshot(clean, storedPhotos){
  return {
    v:1,
    ref:clean.ref, title:defaultTitle(clean.ref), type:clean.type,
    size_m2:clean.size_m2, bedrooms:clean.bedrooms, beds:clean.beds, showers:clean.showers, wc:clean.wc,
    furnished:clean.furnished, available_from:clean.available_from, location:clean.location,
    map:clean.map ? { lat:clean.map.lat, lng:clean.map.lng, r:MAP_RADIUS_M } : null,
    map_url:clean.map_url || '',
    amenities:clean.amenities, utilities:clean.utilities, other_info:clean.other_info,
    photos:storedPhotos.map(p => ({ asset_id:p.asset_id, path:p.path })),
  };
}

/** What the public page gets for a token. A whitelist again, so nothing internal can slip through. */
function publicView(s, photoBase){
  s = s || {};
  const keep = ['ref', 'title', 'type', 'size_m2', 'bedrooms', 'beds', 'showers', 'wc', 'furnished', 'available_from', 'location',
    'amenities', 'utilities', 'other_info'];
  const out = {};
  for (const k of keep) out[k] = s[k] == null ? null : s[k];
  out.title = defaultTitle(s.ref);   // also for presentations saved before 0.4 ("Apartment in …")
  out.map = s.map && validLatLng(s.map.lat, s.map.lng) ? { lat:s.map.lat, lng:s.map.lng, r:Number(s.map.r) || MAP_RADIUS_M } : null;
  out.map_url = cleanMapUrl(s.map_url);
  out.photos = (s.photos || []).filter(p => p && p.path).map(p => ({ url:photoBase + String(p.path).split('/').map(encodeURIComponent).join('/') }));
  return out;
}

/* ---------- links and visits ---------- */
const B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
/** 22 random base62 characters (≈131 bits). getRandomValues = crypto.getRandomValues bound to crypto. */
function randomToken(getRandomValues, len){
  len = len || 22;
  let out = '';
  while (out.length < len) {
    const buf = getRandomValues(new Uint8Array(32));
    for (const b of buf) { if (b < 248 && out.length < len) out += B62[b % 62]; }
  }
  return out;
}
const TOKEN_RE = /^[0-9A-Za-z]{22}$/;
function linkFor(token){ return VIEW_URL + '?t=' + token; }

/* ---------- formatting ---------- */
const numTxt = n => (n == null || n === '' ? '' : String(Math.round(Number(n) * 10) / 10));
// m² as m<sup>2</sup>: THICCCBOI draws "²" like a full-size 2
const SQM = n => esc(numTxt(n)) + '&nbsp;m<sup>2</sup>';
const plural = (n, one, many) => numTxt(n) + ' ' + (Number(n) === 1 ? one : many);
function availability(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '';
  const today = new Date(); const t = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  if (iso <= t) return 'Available now';
  const d = new Date(iso + 'T12:00:00');
  return 'Available from ' + d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}

/* ---------- page ---------- */
function shell(inner){
  return '<header class="top"><div class="wrap"><img class="logo" src="' + LOGO + '" alt="Nordicta Corporate Housing">' +
    (inner ? '<button type="button" class="btn btn-ghost" data-act="print">' + I.download + '<span>Download PDF</span></button>' : '') +
    '</div></header>' + (inner || '');
}
function banner(){
  if (PREVIEW) return '<div class="banner">Förhandsvisning – inte sparad. Kunden ser sidan så här.</div>';
  if (INTERNAL) return '<div class="banner">Intern visning – öppningen räknas inte, eftersom den här webbläsaren är inloggad i presentationsskaparen.</div>';
  return '';
}
function footer(ref){
  return '<footer class="foot"><div class="wrap">' +
    '<img class="logo" src="' + LOGO + '" alt="Nordicta Corporate Housing">' +
    '<p><a href="' + CONTACT.web + '" target="_blank" rel="noopener">' + CONTACT.webLabel + '</a> · <a href="mailto:' + CONTACT.email + '">' + CONTACT.email + '</a> · <a href="tel:' + CONTACT.tel + '">' + CONTACT.phone + '</a></p>' +
    (ref ? '<p>Reference ' + esc(ref) + '</p>' : '') +
    '<p class="privacy">Nordicta records when this page is opened, to follow up on the offer. No IP addresses or other personal data are stored.</p>' +
    '</div></footer>';
}
function contactCard(p){
  const subject = encodeURIComponent('Property offer ' + (p.ref || ''));
  return '<div class="card"><h2>Interested in this property?</h2><p>Contact Nordicta and quote the reference below. We will get back to you quickly.</p>' +
    '<div class="ref"><span>Reference</span><b>' + esc(p.ref) + '</b></div>' +
    '<div class="btns"><a class="btn btn-primary" href="mailto:' + CONTACT.email + '?subject=' + subject + '">' + I.mail + 'Email ' + CONTACT.email + '</a>' +
    '<a class="btn btn-line" href="tel:' + CONTACT.tel + '">' + I.phone + 'Call ' + CONTACT.phone + '</a>' +
    '<button type="button" class="btn btn-line noprint" data-act="print">' + I.download + 'Download PDF</button></div></div>';
}

let PHOTOS = [];
function render(p){
  PHOTOS = p.photos || [];
  const heading = defaultTitle(p.ref);   // always "Property offer · <objektnr>", whatever an older snapshot says
  document.title = heading + ' – Nordicta Corporate Housing';
  const facts = [
    ['home', 'Property type', p.type],
    ['area', 'Size', p.size_m2 != null ? SQM(p.size_m2) : ''],
    ['bed', 'Bedrooms', numTxt(p.bedrooms)],
    ['beds', 'Beds', numTxt(p.beds)],
    ['shower', 'Showers', numTxt(p.showers)],
    ['wc', 'WC', numTxt(p.wc)],
    ['sofa', 'Furnishing', p.furnished],
  ].filter(f => f[2] !== '' && f[2] != null).map(f => f[0] === 'area' ? f : [f[0], f[1], esc(f[2])]);   // values are HTML from here on
  const subParts = [esc(p.location), p.size_m2 != null ? SQM(p.size_m2) : '', p.bedrooms != null ? esc(plural(p.bedrooms, 'bedroom', 'bedrooms')) : '',
    p.beds != null ? esc(plural(p.beds, 'bed', 'beds')) : ''].filter(Boolean);
  const avail = availability(p.available_from);
  const chips = list => '<ul class="chips">' + list.map(a => '<li>' + I.check + esc(a) + '</li>').join('') + '</ul>';
  const amen = (p.amenities || []).length, util = (p.utilities || []).length;

  let h = banner();
  h += '<main><div class="wrap hero">';
  if (PHOTOS.length) {
    h += '<button type="button" class="cover" data-photo="0" aria-label="Show photo 1 of ' + PHOTOS.length + ' in full size">' +
      '<img src="' + esc(PHOTOS[0].url) + '" alt="' + esc([p.type || 'The property', p.location].filter(Boolean).join(' in ')) + '" fetchpriority="high">' +
      (PHOTOS.length > 1 ? '<span class="count">' + I.photos + PHOTOS.length + ' photos</span>' : '') + '</button>';
  }
  h += '<div class="headline"><h1>Property offer' + (p.ref ? ' · <span class="nw">' + esc(p.ref) + '</span>' : '') + '</h1>' +   // = heading; the number never breaks at its dash
    (subParts.length ? '<p class="sub">' + subParts.join(' · ') + '</p>' : '') +
    (avail ? '<span class="avail">' + esc(avail) + '</span>' : '') + '</div></div>';

  h += '<div class="wrap layout"><div class="main">';
  if (facts.length) h += '<section class="block"><h2>Property details</h2><ul class="facts">' +
    facts.map(f => '<li class="fact"><span class="ico">' + I[f[0]] + '</span><span><span class="k">' + f[1] + '</span><br><span class="v">' + f[2] + '</span></span></li>').join('') + '</ul></section>';
  if (PHOTOS.length > 1) h += '<section class="block noprint"><h2>Photos</h2><div class="grid">' +
    PHOTOS.map((ph, i) => '<button type="button" class="thumb" data-photo="' + i + '" aria-label="Show photo ' + (i + 1) + ' of ' + PHOTOS.length + '">' +
      '<img src="' + esc(ph.url) + '" alt="" loading="lazy" decoding="async"></button>').join('') + '</div></section>';
  if (amen || util) {
    h += '<section class="block">';
    if (amen) h += '<h2>Amenities</h2>' + chips(p.amenities);
    if (util) h += (amen ? '<h3 class="sub2">Utilities</h3>' : '<h2>Utilities</h2>') + chips(p.utilities);
    h += '</section>';
  }
  if (p.other_info) h += '<section class="block"><h2>Other information</h2><p class="other">' + esc(p.other_info) + '</p></section>';
  if (p.map || p.location || p.map_url) {
    h += '<section class="block"><h2>Location</h2>' + (p.location ? '<p class="loc-line">' + I.pin + esc(p.location) + '</p>' : '');
    if (p.map) h += '<div class="map" id="map" role="img" aria-label="Map showing the approximate area of the property"></div>' +
      '<p class="mapnote">The circle shows the approximate area, about ' + Math.round((p.map.r || MAP_RADIUS_M) / 100) * 100 + ' m around the property.</p>';
    if (p.map_url) h += '<p class="maplink noprint"><a class="btn btn-line" href="' + esc(p.map_url) + '" target="_blank" rel="noopener">' + I.pin + 'Open in Google Maps</a></p>' +
      '<p class="print-only mapurl">Google Maps: ' + esc(p.map_url) + '</p>';
    h += '</section>';
  }
  h += '<section class="block"><h2>Our corporate housing has everything you need</h2><ul class="services">' +
    SERVICES.map(s => '<li><span class="ico">' + I[s[0]] + '</span><h3>' + s[1] + '</h3><p>' + s[2] + '</p></li>').join('') + '</ul></section>';
  h += '<section class="block print-only"><h2>Contact</h2><p>Email ' + CONTACT.email + ' · Phone ' + CONTACT.phone + ' · Reference ' + esc(p.ref) + '</p></section>';
  h += '</div><aside class="aside">' + contactCard(p) + '</aside></div>';
  if (PHOTOS.length) h += '<div class="wrap print-only pphotos">' + PHOTOS.map(ph => '<div class="pp"><img src="' + esc(ph.url) + '" alt=""></div>').join('') + '</div>';
  h += '</main>' + footer(p.ref) + lightbox();
  $('#app').innerHTML = shell(h);
  if (p.map) drawMap(p.map);
}

function state(kind){
  const T2 = {
    not_found:['This link is not valid', 'Please check that you have the whole link, or contact Nordicta and we will send it again.'],
    revoked:['This offer is no longer available', 'The property may have been let, or the offer has ended. Contact Nordicta and we will help you find another home.'],
    error:['We could not load the offer', 'Please check your internet connection and try again in a moment.'],
  }[kind];
  document.title = T2[0] + ' – Nordicta Corporate Housing';
  $('#app').innerHTML = shell('') + banner() + '<main class="state"><h1>' + T2[0] + '</h1><p>' + T2[1] + '</p><div class="btns">' +
    (kind === 'error' ? '<button type="button" class="btn btn-primary" data-act="reload">Try again</button>' : '') +
    '<a class="btn ' + (kind === 'error' ? 'btn-line' : 'btn-primary') + '" href="mailto:' + CONTACT.email + '">' + I.mail + CONTACT.email + '</a>' +
    '<a class="btn btn-line" href="tel:' + CONTACT.tel + '">' + I.phone + CONTACT.phone + '</a></div></main>' + footer('');
}

/* ---------- map (Leaflet + OpenStreetMap, loaded only when there is a map) ---------- */
let leafletP = null;
function loadLeaflet(){
  if (window.L) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((ok, no) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = LEAFLET.css; css.integrity = LEAFLET.cssSri; css.crossOrigin = 'anonymous';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = LEAFLET.js; js.integrity = LEAFLET.jsSri; js.crossOrigin = 'anonymous';
    js.onload = () => ok(window.L); js.onerror = no;
    document.head.appendChild(js);
  });
  return leafletP;
}
function drawMap(m){
  loadLeaflet().then(L => {
    const el = $('#map'); if (!el) return;
    // centre and zoom first: Leaflet cannot place the circle on a map without a view
    const map = L.map(el, { center:[m.lat, m.lng], zoom:14, scrollWheelZoom:false, dragging:!L.Browser.mobile, tap:false, zoomControl:true, attributionControl:true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
    const c = L.circle([m.lat, m.lng], { radius:m.r || MAP_RADIUS_M, color:'#262262', weight:2, fillColor:'#262262', fillOpacity:.14 }).addTo(map);
    map.fitBounds(c.getBounds(), { padding:[24, 24] });
  }).catch(() => { for (const s of ['#map', '.mapnote']) { const el = $(s); if (el) el.remove(); } });
}

    '<div class="stage" id="lbStage"><img id="lbImg" alt=""></div>' +
    '<div class="nav"><button type="button" class="prev" data-act="lb-prev" aria-label="Previous photo">' + I.left + '</button>' +
    '<button type="button" class="next" data-act="lb-next" aria-label="Next photo">' + I.right + '</button></div></dialog>';
}
let LB = 0;
function lbShow(i){
  LB = (i + PHOTOS.length) % PHOTOS.length;
  $('#lbImg').src = PHOTOS[LB].url;
  $('#lbImg').alt = 'Photo ' + (LB + 1) + ' of ' + PHOTOS.length;
  $('#lbCount').textContent = (LB + 1) + ' / ' + PHOTOS.length;
  const pre = PHOTOS[(LB + 1) % PHOTOS.length]; if (pre) { const im = new Image(); im.src = pre.url; }
}
function lbOpen(i){
  const d = $('#lb'); if (!d || !PHOTOS.length) return;
  lbShow(i);
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
}
function lbClose(){ const d = $('#lb'); if (d && d.open) { d.close ? d.close() : d.removeAttribute('open'); } document.body.style.overflow = ''; }

document.addEventListener('click', e => {
  const ph = e.target.closest('[data-photo]');
  if (ph) { lbOpen(Number(ph.dataset.photo) || 0); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'print') window.print();
  if (act === 'reload') location.reload();
  if (act === 'lb-close') lbClose();
  if (act === 'lb-prev') lbShow(LB - 1);
  if (act === 'lb-next') lbShow(LB + 1);
});
document.addEventListener('keydown', e => {
  const d = $('#lb'); if (!d || !d.open) return;
  if (e.key === 'ArrowLeft') lbShow(LB - 1);
  if (e.key === 'ArrowRight') lbShow(LB + 1);
});
document.addEventListener('close', e => { if (e.target.id === 'lb') document.body.style.overflow = ''; }, true);
let sx = null, sy = null;
document.addEventListener('pointerdown', e => { if (e.target.closest('#lbStage')) { sx = e.clientX; sy = e.clientY; } });
document.addEventListener('pointerup', e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbShow(LB + (dx < 0 ? 1 : -1));
});

/* ---------- opens: count only a person who actually sees the page ---------- */
// The first call goes out when the page has been visible for 2 seconds (link scanners never get that far).
// Seconds on the page are added every 15 s while it is visible. A reload in the same tab within 30 minutes
// is the same opening. Nothing is sent for internal views, previews or automated browsers.
function deviceClass(){
  const ua = navigator.userAgent || '';
  if (/iPad|Tablet|PlayBook|Silk|Kindle/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'surfplatta';
  if (/Mobi|iPhone|iPod|Android/i.test(ua)) return 'mobil';
  return 'dator';
}
function track(){
  if (PREVIEW || INTERNAL || navigator.webdriver || !TOKEN_RE.test(T)) return;
  const VK = 'visit:' + T, START = Date.now();
  const prev = ss.get(VK);
  let visit = prev && Date.now() - prev.at < 30 * 60e3 ? prev.id : null;
  let active = visit ? prev.active || 0 : 0, visibleAt = null, firstTimer = null, beat = null, sent = !!visit;
  const now = () => active + (visibleAt ? (Date.now() - visibleAt) / 1000 : 0);
  const payload = () => JSON.stringify({ action:'seen', t:T, visit, device:deviceClass(), active:Math.round(now()) });
  function remember(){ if (visit) ss.set(VK, { id:visit, at:Date.now(), active:Math.round(now()) }); }
  function send(){
    return fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY }, body:payload(), keepalive:true })
      .then(r => r.json()).then(j => { if (j && j.visit) { visit = j.visit; sent = true; remember(); } }).catch(() => {});
  }
  function beacon(){
    if (!sent || !visit) return;
    remember();
    const body = payload();
    if (!(navigator.sendBeacon && navigator.sendBeacon(FN, new Blob([body], { type:'text/plain' })))) {
      fetch(FN, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body, keepalive:true }).catch(() => {});
    }
  }
  function visible(){
    visibleAt = Date.now();
    if (!sent && !firstTimer) firstTimer = setTimeout(() => { firstTimer = null; send(); }, 2000);
    if (!beat) beat = setInterval(() => {
      if (Date.now() - START > 2 * 3600e3) { clearInterval(beat); beat = null; return; }
      if (sent) send();
    }, 15000);
  }
  function hidden(){
    if (visibleAt) { active += (Date.now() - visibleAt) / 1000; visibleAt = null; }
    if (firstTimer) { clearTimeout(firstTimer); firstTimer = null; }
    if (beat) { clearInterval(beat); beat = null; }
    beacon();
  }
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' ? visible() : hidden());
  window.addEventListener('pagehide', hidden);
  if (document.visibilityState === 'visible') visible();
}

/* ---------- start ---------- */
async function start(){
  if (PREVIEW) {
    let p = null; try { p = JSON.parse(localStorage.getItem(KEY + 'preview') || 'null'); } catch (e) {}
    return p ? render(p) : state('not_found');
  }
  if (!TOKEN_RE.test(T)) return state('not_found');
  let j = null;
  try {
    const r = await fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY }, body:JSON.stringify({ action:'get', t:T }) });
    j = await r.json();
  } catch (e) { return state('error'); }
  if (!j || j.status === 'not_found') return state('not_found');
  if (j.status === 'revoked') return state('revoked');
  if (j.status !== 'ok' || !j.p) return state('error');
  render(j.p);
  track();
}
window.addEventListener('beforeprint', () => { const d = $('#lb'); if (d && d.open) lbClose(); });
start();
})();
</script>
